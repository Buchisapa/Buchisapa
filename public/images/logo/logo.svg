<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="48" height="48">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Amazonian Leaves decoration -->
  <g fill="#16a34a" opacity="0.8">
    <path d="M 90 200 C 60 180, 50 150, 70 140 C 90 130, 110 160, 90 200 Z" />
    <path d="M 410 200 C 440 180, 450 150, 430 140 C 410 130, 390 160, 410 200 Z" />
  </g>

  <!-- Mascot Character: Burger with Hat & Big Smile -->
  <g transform="translate(250, 205)">
    <!-- Shadow under mascot -->
    <ellipse cx="0" cy="45" rx="75" ry="12" fill="#000000" opacity="0.5"/>

    <!-- Bottom Bun -->
    <path d="M -50 25 C -50 40, 50 40, 50 25 Z" fill="#d97706"/>
    <path d="M -48 24 C -48 36, 48 36, 48 24 Z" fill="#f59e0b"/>

    <!-- Burger Patty -->
    <rect x="-54" y="10" width="108" height="14" rx="6" fill="#78350f"/>
    <!-- Grill lines -->
    <line x1="-35" y1="13" x2="-20" y2="21" stroke="#451a03" stroke-width="2.5"/>
    <line x1="-5" y1="13" x2="10" y2="21" stroke="#451a03" stroke-width="2.5"/>
    <line x1="25" y1="13" x2="40" y2="21" stroke="#451a03" stroke-width="2.5"/>

    <!-- Melted Cheddar Cheese -->
    <path d="M -52 10 L 52 10 L 46 19 L 20 16 L 8 23 L -8 15 L -26 21 L -45 14 Z" fill="#facc15"/>

    <!-- Lettuce Wavy -->
    <path d="M -55 8 Q -40 -2 -25 8 Q -10 -2 5 8 Q 20 -2 35 8 Q 50 -2 55 8" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Top Bun -->
    <path d="M -50 5 C -50 -40, 50 -40, 50 5 Z" fill="#f59e0b"/>
    <path d="M -45 2 C -45 -35, 45 -35, 45 2 Z" fill="#fbbf24"/>

    <!-- Mascot Face -->
    <!-- Eyes -->
    <ellipse cx="-16" cy="-14" rx="5" ry="7" fill="#1e293b"/>
    <ellipse cx="16" cy="-14" rx="5" ry="7" fill="#1e293b"/>
    <circle cx="-14" cy="-17" r="2.2" fill="#ffffff"/>
    <circle cx="18" cy="-17" r="2.2" fill="#ffffff"/>
    <!-- Cheeks -->
    <ellipse cx="-26" cy="-8" rx="5" ry="3.5" fill="#f87171" opacity="0.6"/>
    <ellipse cx="26" cy="-8" rx="5" ry="3.5" fill="#f87171" opacity="0.6"/>
    <!-- Big Happy Mouth with Tongue -->
    <path d="M -14 -6 Q 0 10 14 -6 Z" fill="#991b1b"/>
    <path d="M -6 0 Q 0 8 6 0 Z" fill="#f43f5e"/>

    <!-- Sesame seeds -->
    <ellipse cx="-22" cy="-26" rx="2.5" ry="1.2" fill="#fef3c7" transform="rotate(-15 -22 -26)"/>
    <ellipse cx="0" cy="-30" rx="2.5" ry="1.2" fill="#fef3c7"/>
    <ellipse cx="22" cy="-26" rx="2.5" ry="1.2" fill="#fef3c7" transform="rotate(15 22 -26)"/>

    <!-- Hat (Amazonian / Chef combo straw hat) -->
    <g transform="translate(0, -36) rotate(-8)">
      <!-- Hat Brim -->
      <ellipse cx="0" cy="0" rx="50" ry="11" fill="#b45309"/>
      <ellipse cx="0" cy="-2" rx="48" ry="10" fill="#d97706"/>
      <!-- Hat Top -->
      <path d="M -24 -2 C -24 -24, 24 -24, 24 -2 Z" fill="#f59e0b"/>
      <!-- Hat Ribbon with Green Jungle touch -->
      <path d="M -24 -2 Q 0 4 24 -2 L 23 -6 Q 0 0 -23 -6 Z" fill="#15803d"/>
    </g>

    <!-- Sidekick 1: Steaming Caldo Bowl (Left) -->
    <g transform="translate(-75, 20) scale(0.6)">
      <ellipse cx="0" cy="20" rx="35" ry="10" fill="#000" opacity="0.3"/>
      <path d="M -30 0 C -30 25, 30 25, 30 0 Z" fill="#ef4444"/>
      <ellipse cx="0" cy="0" rx="30" ry="8" fill="#fef08a"/>
      <path d="M -10 -6 Q -15 -18 -8 -26" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
      <path d="M 5 -8 Q 12 -20 6 -30" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    </g>

    <!-- Sidekick 2: Golden Crispy Broaster Chicken Leg (Right) -->
    <g transform="translate(75, 18) scale(0.65) rotate(15)">
      <ellipse cx="0" cy="20" rx="25" ry="8" fill="#000" opacity="0.3"/>
      <!-- Bone -->
      <path d="M -15 20 L -30 28" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-32" cy="26" r="5" fill="#f1f5f9"/>
      <circle cx="-28" cy="32" r="5" fill="#f1f5f9"/>
      <!-- Crispy Meat Drumstick -->
      <ellipse cx="5" cy="10" rx="26" ry="18" fill="#d97706" transform="rotate(-15)"/>
      <ellipse cx="8" cy="8" rx="22" ry="14" fill="#f59e0b" transform="rotate(-15)"/>
    </g>
  </g>

  <!-- Typography: BuchiSapa -->
  <g text-anchor="middle" filter="url(#glow)">
    <!-- BUCHISAPA -->
    <text x="250" y="325" font-family="'Fredoka', 'Bungee', cursive, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="1">
      Buchi<tspan fill="#facc15">Sapa</tspan>
    </text>
  </g>

  <!-- Banner: CALDOS, BROASTER & HAMBURGUESAS -->
  <g transform="translate(250, 360)">
    <rect x="-185" y="-16" width="370" height="30" rx="15" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      CALDOS • BROASTER • HAMBURGUESAS
    </text>
  </g>

  <!-- Subtitle / Tagline: SABOR QUE TE LLENA -->
  <g transform="translate(250, 410)">
    <circle cx="-90" cy="-4" r="3" fill="#f59e0b" />
    <circle cx="90" cy="-4" r="3" fill="#f59e0b" />
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#fbbf24" text-anchor="middle" letter-spacing="3">
      SABOR QUE TE LLENA
    </text>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      COMIDA AMAZÓNICA &amp; FAST FOOD 24 HORAS
    </text>
  </g>
</svg>
